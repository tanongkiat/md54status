<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ – MD KKU</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e40af;
      color: #fff;
      padding: .75rem 1.25rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
    }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header .sub { font-size: .78rem; opacity: .75; margin-top: .1rem; }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: .35rem;
    }
    .card-sub {
      font-size: .82rem;
      color: #64748b;
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: .35rem;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: .55rem .75rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 7px;
      font-size: .9rem;
      color: #1e293b;
      transition: border-color .15s;
      margin-bottom: 1.1rem;
    }
    input:focus {
      outline: none;
      border-color: #1e40af;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      border-radius: 7px;
      padding: .55rem .8rem;
      font-size: .82rem;
      margin-bottom: 1.1rem;
    }

    .btn-login {
      width: 100%;
      padding: .65rem;
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <header>
    <h1>MD KKU – Student Editor</h1>
    <div class="sub">ระบบตรวจสอบข้อมูลนักศึกษาแพทย์ มข. รุ่น 54</div>
  </header>

  <div class="center">
    <div class="card">
      <div class="card-title">เข้าสู่ระบบ</div>
      <div class="card-sub">กรุณากรอกชื่อผู้ใช้และรหัสผ่านเพื่อดำเนินการต่อ</div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="POST" action="/login">
        <label for="username">ชื่อผู้ใช้</label>
        <input type="text" id="username" name="username" placeholder="username" autocomplete="username" required />

        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />

        <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
      </form>
    </div>
  </div>
</body>
</html>
